<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta-Prompt Generator</title>
  <meta name="description" content="Sadə ideyanı Claude üçün strukturlaşdırılmış prompta çevirin.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✦</span>
      <div>
        <h1>Meta-Prompt Generator</h1>
        <p class="sub">Sadə ideya → Claude üçün güclü prompt</p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Prompt dili">
      <span class="seg-label">Prompt dili</span>
      <button class="seg-btn active" data-plang="en" title="Claude təlimatları ingiliscə ən dəqiq izləyir">EN</button>
      <button class="seg-btn" data-plang="az">AZ</button>
    </div>
  </header>

  <main class="layout">
    <!-- SOL: giriş -->
    <section class="panel">
      <label class="field-label" for="idea">Nə etmək istəyirsiniz?</label>
      <textarea id="idea" placeholder="İdeyanızı bir-iki cümlə ilə yazın…" autofocus></textarea>

      <div class="examples" id="examples"><span>Nümunə:</span></div>

      <div class="details-grid">
        <label>Kim üçün?
          <input id="audience" type="text" placeholder="məs: yeni başlayanlar">
        </label>
        <label>Məqsəd
          <input id="goal" type="text" placeholder="məs: imtahana hazırlaşmaq">
        </label>
        <label>Həcm / format
          <input id="length" type="text" placeholder="məs: 5 maddə, 300 söz">
        </label>
      </div>
      <p class="note">Bu sahələr opsionaldır, amma nəticəni ən çox yaxşılaşdıran məhz onlardır.</p>

      <details class="group">
        <summary>Parametrlər</summary>
        <div class="grid">
          <label>Sahə <select id="domain"></select></label>
          <label>Ton <select id="tone"></select></label>
          <label>Cavab dili <select id="rlang"></select></label>
          <label>Cavab formatı <select id="format"></select></label>
          <label>Detal səviyyəsi <select id="detail"></select></label>
        </div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="clarify"><span>Claude əvvəlcə sual versin</span></label>
          <label class="toggle"><input type="checkbox" id="thinking"><span>Addım-addım düşünsün</span></label>
        </div>
      </details>
    </section>

    <!-- SAĞ: nəticə -->
    <section class="panel output-panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="prompt" role="tab">Hazır prompt</button>
        <button class="tab" data-mode="meta" role="tab">Claude özü yazsın</button>
      </div>
      <p class="mode-help" id="modeHelp"></p>

      <textarea id="output" class="output" spellcheck="false" placeholder="Sol tərəfdə ideyanızı yazın — prompt burada canlı yaranacaq."></textarea>

      <div class="output-foot">
        <span id="detected" class="detected"></span>
        <div class="foot-right">
          <span id="stats" class="stats"></span>
          <button id="copyBtn" class="btn" type="button" disabled>Copy Prompt</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="templates.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
