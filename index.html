<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta-Prompt Generator</title>
  <meta name="description" content="Sadə ideyanı Claude, ChatGPT, Gemini, Grok, o3, Llama və agentlər üçün strukturlaşdırılmış prompta çevirin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="logo">✦</span>metaprompt</a>
    <div class="seg" role="group" aria-label="Prompt dili">
      <span class="seg-label">Prompt dili</span>
      <button class="seg-btn active" data-plang="en" title="Modellər təlimatları ingiliscə ən dəqiq izləyir">EN</button>
      <button class="seg-btn" data-plang="az">AZ</button>
    </div>
  </header>

  <!-- HERO: giriş -->
  <section class="hero">
    <h1>AI Prompt Generator</h1>
    <p class="lead">Sadə ideyanı Claude, ChatGPT, Gemini və digər modellər üçün güclü, strukturlaşdırılmış prompta çevirin.</p>

    <div class="composer">
      <textarea id="idea" placeholder="Prompt yarat: …" autofocus></textarea>
      <div class="composer-bar">
        <div class="seg" role="group" aria-label="Hədəf model">
          <button class="seg-btn active" data-model="claude">Claude</button>
          <button class="seg-btn" data-model="gpt">ChatGPT</button>
          <button class="seg-btn" data-model="gemini">Gemini</button>
          <select id="moreModels" class="seg-select" aria-label="Digər modellər"></select>
        </div>
        <button id="generateBtn" class="btn" type="button">Generate <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <div class="examples" id="examples"><span>Nümunə:</span></div>

    <div class="details-grid">
      <label>Kim üçün?
        <input id="audience" type="text" placeholder="məs: yeni başlayanlar">
      </label>
      <label>Məqsəd
        <input id="goal" type="text" placeholder="məs: imtahana hazırlaşmaq">
      </label>
      <label>Həcm / format
        <input id="length" type="text" placeholder="məs: 5 maddə, 300 söz">
      </label>
    </div>

    <details class="settings">
      <summary>Əlavə parametrlər</summary>
      <div class="grid">
        <label>Sahə <select id="domain"></select></label>
        <label>Ton <select id="tone"></select></label>
        <label>Cavab dili <select id="rlang"></select></label>
        <label>Cavab formatı <select id="format"></select></label>
        <label>Detal səviyyəsi <select id="detail"></select></label>
      </div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="clarify"><span>Əvvəlcə sual versin</span></label>
        <label class="toggle" title="Nəticə, fərziyyələr, dəlil, yoxlamalar və qeyri-müəyyənlik — səhv tapma və müqayisədə avtomatik qoşulur"><input type="checkbox" id="reasoning"><span>Yoxlanıla bilən cavab</span></label>
      </div>
    </details>
  </section>

  <!-- NƏTİCƏ -->
  <section class="result" id="result">
    <h2>Nəticə</h2>
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="prompt" role="tab">Hazır prompt</button>
      <button class="tab" data-mode="meta" role="tab" id="metaTab">Claude özü yazsın</button>
    </div>
    <p class="mode-help" id="modeHelp"></p>
    <p class="notice" id="notice" hidden></p>

    <div class="output-card">
      <textarea id="output" class="output" spellcheck="false" placeholder="Yuxarıda ideyanızı yazın — prompt burada canlı yaranacaq."></textarea>
      <div class="output-foot">
        <span id="detected" class="detected"></span>
        <div class="foot-right">
          <span id="stats" class="stats"></span>
          <button id="copyBtn" class="btn" type="button" disabled>Copy Prompt</button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="templates.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
